name: pr-review

# Precision-first Go reviewer from KonMam/pr-review-agent: inline comments on
# likely bugs (never style), plus a JSONL findings log as a workflow artifact.
# Needs the OPENROUTER_API_KEY repo secret; skipped without it. Posts as the
# pr-review GitHub App when PR_REVIEW_APP_CLIENT_ID and PR_REVIEW_APP_PRIVATE_KEY
# are set (see pr-review-agent's docs/github-app.md); pull-requests: write stays
# for the github-actions[bot] fallback.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: KonMam/pr-review-agent@main
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          app-client-id: ${{ secrets.PR_REVIEW_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PR_REVIEW_APP_PRIVATE_KEY }}
